<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirage</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{min-height:100vh;background:#0a0a0a;color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:560px;text-align:center}
.logo{width:100px;height:100px;margin:0 auto 24px;display:block;object-fit:cover;border-radius:26px;border:2px solid #facc15;box-shadow:0 0 30px rgba(250,204,21,.35),0 0 70px rgba(250,204,21,.12)}
h1{font-size:56px;font-weight:900;letter-spacing:-3px;margin-bottom:14px}
.description{color:#999;font-size:18px;margin-bottom:25px}
.online{display:inline-flex;align-items:center;gap:10px;padding:11px 18px;border-radius:50px;background:rgba(250,204,21,.06);border:1px solid rgba(250,204,21,.45);color:#facc15;font-size:15px;font-weight:600;margin-bottom:28px}
.online-dot{width:9px;height:9px;border-radius:50%;background:#facc15;box-shadow:0 0 12px #facc15}
.buttons{width:100%}
.button{width:100%;min-height:66px;display:flex;align-items:center;justify-content:center;border-radius:17px;text-decoration:none;font-size:18px;font-weight:800;background:#facc15;color:#111;border:1px solid #facc15;box-shadow:0 5px 25px rgba(250,204,21,.12);transition:.2s ease}
.button:hover{transform:translateY(-3px);background:#fde047;border-color:#fde047}
.icon{margin-right:12px;font-size:23px}
@media(max-width:600px){body{padding:18px}.logo{width:88px;height:88px;border-radius:24px;margin-bottom:20px}h1{font-size:48px}.description{font-size:17px}.button{min-height:62px;font-size:17px}}
</style>
